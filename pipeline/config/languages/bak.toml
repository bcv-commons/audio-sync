# Auto-detected 2026-09-03: Whisper's transcript doesn't text-match
# the reference for this language (header-detect fail rate 100% over 9 chapters, avg fused-word
# share sourced from Whisper 0.0% over 8 chapters) —
# an unreliable guide there does more harm than none at all (same
# signal class as hin.toml's manually-confirmed case). Re-verify if
# this looks wrong — thresholds are in align_pipeline.py's
# AUTO_VERSE_ONLY_* constants.
#
# verse_only_mode skips Whisper entirely for this language and uses
# align_verse_words.py's windowed, verse-anchored MMS-only alignment
# instead (see pipeline/align_verse_words.py's module docstring).
verse_only_mode = true

# A/B tested 2026-09-05 (scratchpad/ab_whisper_hint.py, 1CO 1 BAKIBT):
# whisper_transcribe.py's ISO639_3_TO_WHISPER table now maps bak -> "ba",
# added on the (reasonable but unverified) theory that giving Whisper an
# explicit hint helps languages missing one entirely. For bak it is a
# regression, not a no-op: auto-detect already produces correct-script
# Cyrillic ("Пауелдің көрін фтағы..."), while forcing language="ba" makes
# Whisper emit Latin transliteration instead ("pavildun karin ftaqe...") —
# the same failure class as azb's Perso-Arabic->Latin mismatch, but here it
# actively makes a working default worse rather than being a no-op.
# Overriding back to auto-detect until Whisper's "ba" model itself improves.
#
# Currently inert either way: verse_only_mode above means Whisper never
# runs for this language at all. Set here so the table's default doesn't
# silently reintroduce the regression if bak is ever re-tested for
# possible promotion out of verse_only_mode.
[whisper]
language = "auto"
